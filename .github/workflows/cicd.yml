name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. TEST ──────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

  # ── 2. BUILD ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test          # only runs if tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/           # change to your build output folder

  # ── 3. DEPLOY ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build         # only runs if build passes
    if: github.ref == 'refs/heads/main'   # only deploy on main branch
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          # Replace this block with your deploy command, e.g.:
          # For a VPS via SSH:
          # ssh -i $DEPLOY_KEY user@$SERVER_HOST "cd /app && git pull && pm2 restart all"
          # For Vercel:
          # npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod
          # For Railway/Render: they auto-deploy on push — no step needed
          echo "Add your deploy command here"
